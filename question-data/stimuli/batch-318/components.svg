<title id="title">Four simplified electronic component sketches</title>
<desc id="desc">A: a rectangular dark chip with pins on two sides. B: one domed light with two leads. C: a panel of sixteen small light points. D: a square part with a round pressable top and four leads. These are concept sketches, not product or wiring diagrams.</desc>
