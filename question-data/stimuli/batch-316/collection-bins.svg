<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Two labelled collection bins</title>
  <desc id="desc">Two separate bins, one labelled Paper and one labelled Plastic.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <g stroke="#17324d" stroke-width="5" stroke-linejoin="round">
    <path d="M100 105H280L265 310H115Z" fill="#d9eef8"/>
    <path d="M360 105H540L525 310H375Z" fill="#fff0c5"/>
    <rect x="90" y="85" width="200" height="30" rx="8" fill="#17324d"/>
    <rect x="350" y="85" width="200" height="30" rx="8" fill="#17324d"/>
  </g>
  <g fill="#17324d" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="middle">
    <text x="190" y="215">Paper</text>
    <text x="450" y="215">Plastic</text>
  </g>
</svg>
