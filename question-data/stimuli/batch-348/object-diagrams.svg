<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
<title id="title">Object diagrams A to E</title><desc id="desc">Five original black line object diagrams in separately lettered panels. Names and marking key are supplied separately to the examiner. Not to scale; no operating instructions.</desc>
